[project]
name = "rag-jina"
version = "0.1.0"
description = "A small Late Chunking RAG learning project"
readme = "README.md"
requires-python = ">=3.13.9"
dependencies = [
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
